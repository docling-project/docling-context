name: Run checks

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  python-checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev ninja-build
      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install project dependencies
        run: uv sync --locked --no-default-groups --group ci --python ${{ matrix.python-version }}
      - name: Check lint
        run: uv run --no-sync ruff check src tests
      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests
      - name: Check types
        run: uv run --no-sync mypy src/docling_context --ignore-missing-imports
      - name: Run tests
        run: uv run --no-sync pytest --cov=docling_context --cov-report=xml:coverage.xml -q tests
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: docling-context
          fail_ci_if_error: false

  build-package:
    name: Build distribution
    needs: python-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build wheel and source archive
        run: uv build --out-dir dist
      - name: Verify archive contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          archive = next(Path("dist").glob("*.tar.gz"))
          wheel = next(Path("dist").glob("*.whl"))
          with open_tar(archive) as source:
              names = source.getnames()
              assert not any("/.references/" in name or "/.plans/" in name for name in names)
              assert any(name.endswith("/src/docling_context/__init__.py") for name in names)
          with ZipFile(wheel) as package:
              assert "docling_context/__init__.py" in package.namelist()
          PY
      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docling-context"
version = "0.1.0"
description = "Local-first DocLang context storage for agent tools"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Staar", email = "taa@zurich.ibm.com" }]
keywords = ["agents", "context", "doclang", "documents", "memory"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = ["doclang"]

[project.urls]
Repository = "https://github.com/docling-project/docling-context"

[tool.uv.sources]
doclang = { git = "https://github.com/doclang-project/doclang", rev = "92d299026f2f985328b52424483c711e19b2f306" }

[tool.docling-context.dependencies]
doclang-license = "Apache-2.0"

[dependency-groups]
ci = ["mypy~=1.6", "pytest~=8.3", "pytest-cov>=6.1.1", "ruff>=0.14.11"]
dev = [{ include-group = "ci" }]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/docling_context",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

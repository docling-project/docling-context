[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docling-context"
version = "0.1.0"
description = "Local-first DocLang context storage for agent tools"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Staar", email = "taa@zurich.ibm.com" }]
keywords = ["agents", "context", "doclang", "documents", "memory"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "doclang",
    "httpx>=0.27,<1",
    "mcp>=1.20,<2",
    "ruamel.yaml>=0.18,<1",
    "tabulate>=0.10,<1",
    "tomlkit>=0.13,<1",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
conversion = ["docling[rapidocr]>=2.134.0,<3"]
vectors = [
    "numpy>=1.26",
    "turbovec>=1,<2",
    "fastembed>=0.8.1,<1",
    "mlx-embedding-models==0.0.11; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "transformers>=4.47,<5; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
dc = "docling_context.cli:main"
docling-context = "docling_context.app:main"

[project.urls]
Repository = "https://github.com/docling-project/docling-context"

[tool.uv.sources]
doclang = { git = "https://github.com/doclang-project/doclang", rev = "92d299026f2f985328b52424483c711e19b2f306" }

[tool.docling-context.dependencies]
doclang-license = "Apache-2.0"

[dependency-groups]
ci = ["mypy~=1.6", "pytest~=8.3", "pytest-cov>=6.1.1", "ruff>=0.14.11"]
dev = [{ include-group = "ci" }]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/docling_context",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
